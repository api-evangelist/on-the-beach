summary: 'On the Beach shipped a ChatGPT App on 1 April 2026, claiming to be the first UK online travel
  agent to connect to ChatGPT Apps. ChatGPT Apps are served by an MCP server (OpenAI Apps SDK), so this
  is On the Beach''s first externally addressable machine surface — and it is the first thing the company
  has ever exposed beyond the consumer website. It is distribution-gated, not developer self-serve: the
  only way to reach it is to add the app inside ChatGPT. No endpoint, tool list, input schema, auth flow
  or terms are documented publicly by On the Beach, and there is no developer portal behind it.'
