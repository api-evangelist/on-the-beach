    - url: https://www.onthebeachgroupplc.com/technology
      status: 404
    - url: https://www.classic-collection.co.uk/openapi.json
      status: 403
    note: >-
      HTTP 403 responses on onthebeach.co.uk are a Cloudflare bot challenge, not
      evidence of a protected API; the same host returned HTTP 200 for
      /robots.txt, /sitemap.xml, /main_pages.xml and /affiliates and HTTP 404 for
      /openapi.json, /llms.txt and /.well-known/*, which confirms those paths do
      not exist rather than being blocked.
  secondSource:
    value: interchangeable-alternatives
    alternativesConsidered:
    - Jet2holidays - UK's largest ATOL holder, same flight-plus-hotel package product
    - TUI UK - vertically integrated tour operator with own airline
    - easyJet holidays - carrier-owned dynamic packager on the same short-haul routes
    - loveholidays - closest direct UK online-only dynamic packaging competitor
    - Expedia and Booking.com - global OTAs offering packages into the same UK source
      market
    - Hays Travel and other high-street agents selling equivalent ATOL packages
    reasoning: |
      For a consumer there is no lock-in whatsoever. On the Beach holds no
      exclusive inventory: the 42 airlines and 24k hotels it sells are the same
      supply its competitors buy from the same bedbanks and carriers. The FY25
      results themselves acknowledge the substitutability - "Consumers are
      shopping around as much as ever so we are having to reacquire them" - and
      the entire "stickiness" strategy pillar exists precisely because
      switching cost is near zero. For a developer the question is moot: there
      is no integration to switch away from.
  exitPath:
    value: no-export-published
    operationCited: none
    evidence: |
      No export, dump, bulk, reporting or data-portability operation is
      published, because no API exists. On the Beach is a UK data controller and
      UK GDPR Article 20 portability rights apply to its customers as a matter
      of law, but no implemented self-serve export mechanism could be verified.
      https://www.onthebeach.co.uk/privacy is listed in the site's own
      main_pages.xml sitemap but returned HTTP 403 to automated retrieval on
      2026-07-28, so no portability commitment could be read or quoted. Recorded
      as no-export-published rather than export-on-request because nothing was
      actually verified.
  identifierPortability:
    value: >-
      Industry-portable identifiers on the inbound side only - IATA airline
      designators and IATA airport codes across 42 carriers, plus CAA ATOL
      licence numbers and ATOL certificates on the consumer side. Outbound there
      is nothing: booking references, hotel records and price rows live in the
      proprietary Hotel Discovery Cache and Fast Flexible Search in-memory store,
      keyed by internal supplier and inventory IDs that are never published.
    evidence: |
      IATA airport/airline codes are implied throughout the consumer product and
      the FY25 "Airlines on sale: 42" and "Destinations on sale: 240" metrics.
      ATOL is confirmed in the FY25 accounts ("All ATOL protected customer monies
      are held in a trust account"). No PNR record locator, IATA/ARC agency
      number, GDS record ID, hotel chain code or GIATA ID is exposed publicly,
      because no interface exposes anything. On the Beach holds no IATA/ARC
      accreditation of its own - it is not a ticketing agency; it buys seats
      through direct carrier connections and consolidators.
  contractualLockIn:
    value: nothing published
    evidence: |
      No developer terms, partner agreement, API licence, rate card, minimum
      term, exclusivity clause, full-content agreement, segment fee or
      termination-notice provision is published anywhere by On the Beach,
      because there is no developer or partner programme to govern.

      Consumer-facing terms do exist at
      https://www.onthebeach.co.uk/terms-and-conditions,
      /package-holiday-terms-and-conditions and /hotel-only-terms-and-conditions
      (all present in the site's own main_pages.xml sitemap) but all returned
      HTTP 403 to automated retrieval on 2026-07-28, so no clause is quoted
      here. Nothing in these is a developer-facing commercial term in any case.

      The nearest thing to a partner contract is the affiliate programme, and
      even that is not On the Beach's own paper: affiliates contract with the
      Partnerize and Awin networks, whose terms and tracking interfaces govern
      the relationship. /affiliates returned HTTP 200 but the page body was
      blocked by the same Cloudflare challenge, and
      https://ui.awin.com/merchant-profile/3655 returned HTTP 404.
  accessGate:
    value: none-published
    whatADeveloperMustSign: |
      Nothing, because nothing is on offer. There is no signup, no key issuance,
      no sandbox, no application form, no approval queue, no partner login and
      no commercial-agreement route to an On the Beach API. The only third-party
      relationship a developer can enter is publisher affiliation via Partnerize
      or Awin, which grants tracking links and marketing creative - not data
      access, not inventory, not booking capability.
    gated: true
    gateType: no surface exists to gate
  distributionModel:
    value: aggregator-reseller
    reasoning: |
      On the Beach occupies the aggregator/reseller seat: it aggregates
      third-party airline seats and third-party hotel beds and resells them as
      its own ATOL-protected packages. It reaches its own customers
      direct-to-consumer only - onthebeach.co.uk, sunshine.co.uk and the mobile
      app, with affiliate networks as a marketing channel rather than a
      distribution API. It has no channel-manager, GDS, wholesale or white-label
      outbound distribution, and the last B2B route it had was closed in
      September 2025.
    inboundSupply:
    - Direct airline connections, including a Ryanair "Approved OTA" commercial
      partnership signed in FY24 that the company credits with trebling addressable
      market "from 16m pax to 50m pax"
    - Emirates NDC "Online B2B" API direct connect, taken in January 2019, reported
      at the time as the first such connection by a UK OTA
    - Bedbank inventory plus direct hotel contracting, 24k hotels on sale in FY25
    - No GDS. On the Beach does not distribute through or source through Amadeus, Sabre
      or Travelport.
  ndcPosture:
    value: >-
      NDC consumer, not NDC provider. On the Beach holds no IATA NDC
      certification level (it is not a carrier and not an IATA-accredited agent),
      publishes no NDC endpoint, and imposes no surcharges. It is on the buying
      end: it took Emirates' NDC-based Online B2B API as a direct connect in
      January 2019, reported at the time as the first UK OTA to do so, and
      layered a direct Ryanair Approved OTA connection on top in 2024. Both
      route around the GDS entirely, which is the structural point - On the Beach
      is one of the UK demand-side businesses whose economics depend on NDC and
      direct-connect succeeding against GDS intermediation.
    ndcApiPublished: false
    gdsSurcharges: not applicable
    certificationClaimed: none found
  standardConformance:
    value: no standard reference found
    evidence: |
      No OpenTravel/OTA, HTNG, IATA NDC, OpenAPI, AsyncAPI, JSON Schema or
      Arazzo artifact is published under On the Beach's name. The only standards
      visible in the corpus are inbound supplier schemas it consumes privately.
  whatItCostsToLeave: |
    Almost nothing, and that is the finding. On the Beach has inverted the
    sector's normal shape: it is a business built ENTIRELY on other people's
    switching costs falling, not on raising its own. Because it publishes no
    interface, there is no integration for anyone to be locked into; because it
    holds no exclusive inventory, its consumers can rebook the identical holiday
    elsewhere; and because its supply is direct-connect and NDC rather than GDS,
    it deliberately sits outside the forty-year intermediation structure that
    creates lock-in for everyone else. The company's exposure is therefore the
    mirror image: its own switching cost is what it must manufacture, which is
    exactly what the "stickiness" strategy pillar, the app push and the 2+
    customer metric are for. For the Kin Score this is the case that shows a
    zero-lock-in profile is not automatically a good API posture - it is here a
    symptom of publishing nothing at all.
