actions:
  apisListed: 0
  openapiDirectoryCreated: false
  reason: |
    apis[] is empty and no openapi/ directory was created. Nothing real was
    found to save. On the Beach publishes no API, no specification and no
    developer documentation of any kind. Creating placeholder specs would be
    fabrication.
  recommendedRescan: >-
    Re-probe if On the Beach ever ships the ChatGPT/Gemini integration its FY25
    results describe as "enabling direct integration into ChatGPT, Gemini, and
    emerging AI platforms" - that would be the first moment any part of its
    API-first architecture becomes externally addressable, and the first thing
    worth harvesting.
