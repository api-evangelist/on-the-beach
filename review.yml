aid: on-the-beach
name: On the Beach
review:
  question: Does On the Beach Group publish a public developer portal, API documentation,
    or any machine-readable API contract?
  answer: false
  date: '2026-07-28'
  reviewer: API Evangelist
  tier: ota-metasearch
  homeMarket: United Kingdom
  openapiHarvested: false
  specsCount: 0
findings:
  summary: |
    On the Beach Group plc is a UK online travel agent and dynamic packager. It
    is a CONSUMER of travel distribution APIs, not a producer of them. Nothing
    machine-readable is published under its own name.

    Every developer-facing host and path was probed on 2026-07-28. There is no
    developer portal, no API reference, no OpenAPI/Swagger document, no partner
    or trade API, no llms.txt, no .well-known catalogue and no MCP surface. The
    company's only public code presence is a GitHub organisation of 24 small
    Ruby libraries, all last pushed between 2012 and 2018, none of which
    describe or wrap a product API.

    The FY25 final results (2 December 2025) state plainly that the internal
    architecture is API-first - "We have spent 3 years building AI ready tech.
    Our API-first microservices architecture is enabling direct integration into
    ChatGPT, Gemini, and emerging AI platforms" - but that architecture is
    entirely private. No endpoint, schema, scope or key-issuing flow is exposed
    to a third party.

    Its only B2B channel, Classic Collection (and the Classic Package Holidays
    agent portal), was placed into orderly wind-down: "On 23 September 2025, the
    Board made the decision to abandon the Classic Collection Holdings
    operation". Both classicpackageholidays.co.uk and classicpackageholidays.com
    returned HTTP 530 (Cloudflare origin unreachable) when probed. The company
    now has no B2B distribution surface at all.
  companyFacts:
    legalName: On the Beach Group plc
    listing: London Stock Exchange (ticker OTB)
    founded: 2004
    founder: Simon Cooper
    registeredOffice: Aeroworks, 5 Adair Street, Manchester M1 2NQ, United Kingdom
    fy25TotalTransactionValue: GBP 1.25bn (FY24 GBP 1.12bn, +11%)
    fy25Customers: 1.7 million
    fy25AirlinesOnSale: 42
    fy25HotelsOnSale: 24,000
    fy25DestinationsOnSale: 240
    regulatoryProtection: ATOL licensed by the UK Civil Aviation Authority; "All ATOL
      protected customer monies are held in a trust account until after the provision
      of the holiday"
    brands:
    - On the Beach (onthebeach.co.uk) - core B2C brand, UK and Republic of Ireland
    - sunshine.co.uk - secondary B2C brand acquired 2013
    - Classic Collection Holidays - B2B tour operator, wind-down commenced 23 September
      2025
    - Classic Package Holidays - self-service agent portal derived from Classic Collection,
      site now unreachable (HTTP 530)
  proprietaryPlatform:
    hotelDiscoveryCache: "AI-powered platform managing more than 5 billion hotel prices,
      described in FY25 results as ‘our Hotel Discovery Cache’"
    fastFlexibleSearch: "In-memory data store allowing search of the entire holiday
      inventory for any date range in under a second, described as ‘Fast Flexible
      Search’"
    note: Both are named as proprietary technology. Neither is exposed, licensed or
      documented externally.
switchingCost:
  interfaceShape:
    value: none-published
    standardNamed: none
    evidence: |
      No interface of any kind is published by On the Beach. No OpenTravel/OTA
      XML, no HTNG, no IATA NDC schema, no OpenAPI, no GraphQL, no AsyncAPI, no
      Postman collection and no partner XML spec was found under any On the
      Beach or On the Beach Group host. The standards it touches (NDC, airline
      direct-connect schemas, bedbank XML) are consumed inbound from suppliers,
      never re-published outbound.
    probedForContracts:
